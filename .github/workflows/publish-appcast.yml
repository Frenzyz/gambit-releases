name: Publish appcast

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  appcast:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Require Sparkle private key
        env:
          SPARKLE_ED25519_PRIVATE_KEY: ${{ secrets.SPARKLE_ED25519_PRIVATE_KEY }}
        run: |
          if [ -z "$SPARKLE_ED25519_PRIVATE_KEY" ]; then
            echo "Set SPARKLE_ED25519_PRIVATE_KEY on this repo. Do not commit the key." >&2
            exit 1
          fi
      - name: Download Sparkle tools
        run: |
          curl -fsSL -o /tmp/Sparkle.tar.xz \
            https://github.com/sparkle-project/Sparkle/releases/download/2.9.6/Sparkle-2.9.6.tar.xz
          tar -xJf /tmp/Sparkle.tar.xz -C /tmp
          echo "/tmp/bin" >> "$GITHUB_PATH"
      - name: Fetch latest release DMG
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p archives
          gh release download --repo "${{ github.repository }}" --pattern "Gambit.dmg" --dir archives
          test -f archives/Gambit.dmg
          cp notes/*.html archives/ 2>/dev/null || true
      - name: Notarize DMG when Apple secrets exist
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_ID_PASSWORD: ${{ secrets.APPLE_ID_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          password="${APPLE_APP_SPECIFIC_PASSWORD:-${APPLE_ID_PASSWORD:-}}"
          if [ -z "$APPLE_ID" ] || [ -z "$password" ] || [ -z "$APPLE_TEAM_ID" ]; then
            echo "Notarization skipped: set APPLE_ID, APPLE_APP_SPECIFIC_PASSWORD, APPLE_TEAM_ID."
            echo "Paste the app-specific password only in the GitHub secret field, not into chat."
            exit 0
          fi
          xcrun notarytool submit archives/Gambit.dmg \
            --apple-id "$APPLE_ID" \
            --password "$password" \
            --team-id "$APPLE_TEAM_ID" \
            --wait
          xcrun stapler staple archives/Gambit.dmg
      - name: Generate appcast
        env:
          SPARKLE_ED25519_PRIVATE_KEY: ${{ secrets.SPARKLE_ED25519_PRIVATE_KEY }}
        run: |
          key="$(mktemp)"
          umask 077
          printf '%s\n' "$SPARKLE_ED25519_PRIVATE_KEY" > "$key"
          /tmp/bin/generate_appcast \
            --ed-key-file "$key" \
            --download-url-prefix "https://github.com/${{ github.repository }}/releases/latest/download/" \
            archives
          rm -f "$key"
          test -f archives/appcast.xml
          cp archives/appcast.xml appcast.xml
      - name: Commit appcast
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add appcast.xml
          git diff --cached --quiet && echo "appcast unchanged" && exit 0
          git commit -m "Update Sparkle appcast from GitHub Release"
          git push
